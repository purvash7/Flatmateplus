name: Apply FlatMate+ final features
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply final implementation
        run: |
          python3 <<'PY'
          from pathlib import Path
          def write(path, content): Path(path).write_text(content)

          landing = '''import { useState, useEffect, useRef } from "react";
          import { useNavigate } from "react-router-dom";
          import { useAuth } from "@/context/AuthContext";
          import { api, setToken } from "@/lib/api";
          import { Button } from "@/components/ui/button";
          import { Input } from "@/components/ui/input";
          import { toast } from "sonner";
          import { motion } from "framer-motion";
          import { Home } from "lucide-react";
          export default function Landing() {
            const { login, register } = useAuth(); const [mode,setMode]=useState("login");
            const [form,setForm]=useState({email:"",password:"",name:""}); const [busy,setBusy]=useState(false);
            const googleRef=useRef(null); const navigate=useNavigate();
            const routeUser=(u)=>{if(!u.onboarding_done)navigate("/onboarding");else if(!u.liveness_verified)navigate("/liveness");else if(!u.profile_complete)navigate("/profile-setup");else navigate("/discover")};
            const submit=async(e)=>{e.preventDefault();setBusy(true);try{const u=mode==="login"?await login(form.email,form.password):await register(form.email,form.password,form.name);toast.success(`Welcome ${u.name?.split(" ")[0]||""}!`);routeUser(u)}catch(err){toast.error(err.response?.data?.detail||"Something went wrong")}finally{setBusy(false)}};
            useEffect(()=>{const id=process.env.REACT_APP_GOOGLE_CLIENT_ID;if(!id||!googleRef.current||!window.google?.accounts?.id)return;window.google.accounts.id.initialize({client_id:id,callback:async({credential})=>{setBusy(true);try{const {data}=await api.post("/auth/google",{credential});setToken(data.token);toast.success(`Welcome ${data.user.name?.split(" ")[0]||""}!`);routeUser(data.user)}catch(err){toast.error(err.response?.data?.detail||"Google sign-in failed")}finally{setBusy(false)}}});googleRef.current.innerHTML="";window.google.accounts.id.renderButton(googleRef.current,{theme:"outline",size:"large",width:360,text:"continue_with",shape:"pill"})},[mode]);
            return <div className="app-shell"><div className="relative min-h-[100dvh] flex flex-col"><div className="absolute top-0 left-0 right-0 h-64 bg-gradient-to-b from-primary/15 to-transparent pointer-events-none"/><div className="relative px-6 pt-12 pb-6"><div className="flex items-center gap-2"><div className="w-9 h-9 rounded-2xl bg-primary text-primary-foreground grid place-items-center shadow-soft"><Home className="w-5 h-5" strokeWidth={2.4}/></div><div><div className="font-display font-extrabold text-xl leading-none">FlatMate+</div><div className="text-[11px] text-muted-foreground mt-1 font-mono-label">FIND YOUR PEOPLE</div></div></div></div><div className="px-6 flex-1 flex flex-col justify-center"><motion.div initial={{opacity:0,y:12}} animate={{opacity:1,y:0}} transition={{duration:.5}}><h1 className="text-4xl sm:text-5xl font-display font-extrabold leading-[1.05]">Live with people <span className="text-primary">who get you.</span></h1><p className="mt-4 text-muted-foreground text-base leading-relaxed">India's smart flatmate matcher — swipe, match on compatibility, chat, move in.</p></motion.div><form onSubmit={submit} className="mt-8 space-y-3">{mode==="register"&&<Input data-testid="auth-name-input" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Your name" required className="rounded-2xl h-12 bg-card"/>}<Input data-testid="auth-email-input" type="email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})} placeholder="you@example.com" required className="rounded-2xl h-12 bg-card"/><Input data-testid="auth-password-input" type="password" value={form.password} onChange={e=>setForm({...form,password:e.target.value})} placeholder="Password" required minLength={6} className="rounded-2xl h-12 bg-card"/><Button data-testid="auth-submit-btn" type="submit" disabled={busy} className="w-full h-12 rounded-2xl text-base bg-primary hover:bg-primary/90 shadow-soft">{busy?"…":mode==="login"?"Log in":"Create account"}</Button></form><div className="flex items-center gap-3 my-5"><div className="h-px bg-border flex-1"/><div className="font-mono-label text-muted-foreground">OR</div><div className="h-px bg-border flex-1"/></div><div ref={googleRef} className="flex justify-center" aria-label="Continue with Google"/><button data-testid="auth-toggle-btn" type="button" onClick={()=>setMode(mode==="login"?"register":"login")} className="mt-5 text-sm text-muted-foreground hover:text-foreground text-center w-full">{mode==="login"?"New here? ":"Already have an account? "}<span className="text-primary font-semibold underline-offset-4 hover:underline">{mode==="login"?"Create an account":"Log in"}</span></button></div><div className="px-6 pb-8 pt-4 text-center text-[11px] text-muted-foreground font-mono-label">MADE IN INDIA • FOR PEOPLE, NOT PROFILES</div></div></div>;
          }
          '''
          write('frontend/src/pages/Landing.jsx',landing)

          p=Path('backend/server.py'); s=p.read_text()
          s=s.replace('import os, logging, uuid, jwt, bcrypt, requests, math','import os, logging, uuid, jwt, bcrypt, requests, math, shutil',1)
          s=s.replace("JWT_SECRET = os.environ['JWT_SECRET']\nAPP_NAME = os.environ.get('APP_NAME', 'flatmate-plus')", "JWT_SECRET = os.environ['JWT_SECRET']\nGOOGLE_CLIENT_ID = os.environ.get('GOOGLE_CLIENT_ID', '')\nGOOGLE_JWKS_CLIENT = jwt.PyJWKClient('https://www.googleapis.com/oauth2/v3/certs')\nAPP_NAME = os.environ.get('APP_NAME', 'flatmate-plus')",1)
          s=s.replace('class UserLogin(BaseModel):\n    email: EmailStr\n    password: str\n','class UserLogin(BaseModel):\n    email: EmailStr\n    password: str\n\nclass GoogleLoginIn(BaseModel):\n    credential: str\n',1)
          google='''@api_router.post("/auth/google")
          async def google_login(data: GoogleLoginIn):
              if not GOOGLE_CLIENT_ID: raise HTTPException(status_code=503, detail="Google login is not configured")
              try:
                  key=GOOGLE_JWKS_CLIENT.get_signing_key_from_jwt(data.credential)
                  claims=jwt.decode(data.credential,key.key,algorithms=["RS256"],audience=GOOGLE_CLIENT_ID,issuer="https://accounts.google.com")
              except Exception: raise HTTPException(status_code=401,detail="Invalid Google credential")
              if not claims.get("email") or not claims.get("email_verified"): raise HTTPException(status_code=401,detail="Google email is not verified")
              email=claims["email"].lower(); user=await db.users.find_one({"email":email},{"_id":0})
              if not user:
                  user={"user_id":f"user_{uuid.uuid4().hex[:12]}","email":email,"name":claims.get("name") or email.split("@")[0],"picture":claims.get("picture"),"google_sub":claims.get("sub"),"onboarding_done":False,"liveness_verified":False,"profile_complete":False,"main_photo_verified":False,"created_at":datetime.now(timezone.utc).isoformat()}; await db.users.insert_one(user)
              else:
                  await db.users.update_one({"user_id":user["user_id"]},{"$set":{"google_sub":claims.get("sub"),"picture":user.get("picture") or claims.get("picture")}}); user=await db.users.find_one({"user_id":user["user_id"]},{"_id":0})
              return {"token":create_jwt(user["user_id"]),"user":user_public(user)}
          '''
          s=s.replace('@api_router.post("/auth/session")',google+'\n@api_router.post("/auth/session")',1)
          delete='''@api_router.delete("/auth/account")
          async def delete_account(user: dict = Depends(get_current_user)):
              uid=user["user_id"]; matches=await db.matches.find({"user_ids":uid},{"_id":0,"match_id":1}).to_list(None); mids=[m["match_id"] for m in matches if m.get("match_id")]
              if mids: await db.messages.delete_many({"match_id":{"$in":mids}})
              await db.messages.delete_many({"sender_id":uid}); await db.matches.delete_many({"user_ids":uid}); await db.swipes.delete_many({"$or":[{"user_id":uid},{"target_user_id":uid}]}); await db.user_sessions.delete_many({"user_id":uid}); await db.files.delete_many({"user_id":uid}); await db.users.delete_one({"user_id":uid})
              root=STORAGE_DIR/APP_NAME/"uploads"/uid
              try:
                  if root.exists(): shutil.rmtree(root)
              except Exception as exc: logger.warning("Storage cleanup failed for %s: %s",uid,exc)
              return {"ok":True}
          '''
          s=s.replace('@api_router.get("/auth/me")',delete+'\n@api_router.get("/auth/me")',1)
          s=s.replace('if dist > 0.6:','if dist > 0.65:',1)
          s=s.replace('scoreThreshold: 0.5','scoreThreshold: 0.4',1)
          s=s.replace('add(a.get("food_pref") == b.get("food_pref") and a.get("food_pref"), "food_same", 8)','food_a, food_b = a.get("food_pref"), b.get("food_pref")\n    food_compatible = food_a == food_b or {food_a, food_b} <= {"veg", "veg_ok_nonveg_cooked"}\n    add(food_compatible and food_a, "food_same", 8)',1)
          s=s.replace('if "food_pref" in non_neg and a.get("food_pref") != b.get("food_pref"):\n        return False','if "food_pref" in non_neg:\n        food_a, food_b = a.get("food_pref"), b.get("food_pref")\n        food_compatible = food_a == food_b or {food_a, food_b} <= {"veg", "veg_ok_nonveg_cooked"}\n        if not food_compatible:\n            return False',1)
          p.write_text(s)

          p=Path('frontend/src/pages/Onboarding.jsx'); s=p.read_text()
          s=s.replace('[["veg","Vegetarian"],["non_veg","Non-Vegetarian"],["eggetarian","Eggetarian"],["vegan","Vegan"]]','[["veg","Vegetarian"],["veg_ok_nonveg_cooked","Vegetarian, okay with non-veg being cooked"],["non_veg","Non-Vegetarian"],["eggetarian","Eggetarian"],["vegan","Vegan"]]',1)
          s=s.replace('<div className="flex items-center justify-between text-sm mb-1 text-muted-foreground">\n              <span>₹{d.budget_min.toLocaleString()}</span><span>₹{d.budget_max.toLocaleString()}</span>\n            </div>\n            <Slider data-testid="ob-budget" min={3000} max={80000} step={1000}\n                    value={[d.budget_min, d.budget_max]}\n                    onValueChange={(v)=>{ set("budget_min", v[0]); set("budget_max", v[1]); }}/>', '<div className="grid grid-cols-2 gap-3 mb-3"><Input data-testid="ob-budget-min" type="number" min={3000} max={80000} step={1000} value={d.budget_min} onChange={e=>set("budget_min",Math.min(Number(e.target.value)||3000,d.budget_max))} className="rounded-2xl h-11"/><Input data-testid="ob-budget-max" type="number" min={3000} max={80000} step={1000} value={d.budget_max} onChange={e=>set("budget_max",Math.max(Number(e.target.value)||80000,d.budget_min))} className="rounded-2xl h-11"/></div><Slider data-testid="ob-budget" min={3000} max={80000} step={1000} value={[d.budget_min,d.budget_max]} onValueChange={v=>{set("budget_min",v[0]);set("budget_max",v[1])}}/>',1)
          s=s.replace('<div className="mt-8">{cur.body}</div>','<div className="mt-8 onboarding-questions">{cur.body}</div>',1); p.write_text(s)
          p=Path('frontend/src/App.css'); s=p.read_text(); s+='\n.onboarding-questions > div > div { border-bottom: 1px solid hsl(var(--border)); padding-bottom: 1.25rem; }\n'; p.write_text(s)

          p=Path('frontend/src/pages/Profile.jsx'); s=p.read_text().replace('import { useAuth } from "@/context/AuthContext";','import { useAuth } from "@/context/AuthContext";\nimport { useState } from "react";',1).replace('import { fileUrl, setToken } from "@/lib/api";','import { api, fileUrl, setToken } from "@/lib/api";',1).replace('import { LogOut, MapPin, Briefcase, Utensils, CheckCircle2 } from "lucide-react";','import { LogOut, MapPin, Briefcase, Utensils, CheckCircle2, Trash2 } from "lucide-react";',1).replace('  const { user, logout } = useAuth();','  const { user, logout } = useAuth();\n  const [deleting,setDeleting]=useState(false);',1).replace('  const doLogout = async () => {','  const deleteAccount=async()=>{if(!window.confirm("Delete your account and all your FlatMate+ data? This cannot be undone."))return;setDeleting(true);try{await api.delete("/auth/account");setToken(null);await logout();navigate("/")}catch(err){setDeleting(false);window.alert(err.response?.data?.detail||"Could not delete your account. Please try again.")}};\n\n  const doLogout = async () => {',1).replace('        <Button data-testid="manage-photos-btn"','        <Button data-testid="delete-account-btn" variant="outline" onClick={deleteAccount} disabled={deleting} className="mt-5 w-full h-11 rounded-2xl border-destructive/40 text-destructive hover:bg-destructive/10"><Trash2 className="w-4 h-4 mr-2"/>{deleting?"Deleting…":"Delete account"}</Button>\n        <Button data-testid="manage-photos-btn"',1); p.write_text(s)
          p=Path('frontend/public/index.html'); s=p.read_text();
          if 'accounts.google.com/gsi/client' not in s:s=s.replace('</head>','<script src="https://accounts.google.com/gsi/client" async defer></script>\n    </head>',1)
          p.write_text(s); Path('frontend/.env.example').write_text('REACT_APP_GOOGLE_CLIENT_ID=your-google-web-client-id.apps.googleusercontent.com\n'); Path('backend/.env.example').write_text('GOOGLE_CLIENT_ID=your-google-web-client-id.apps.googleusercontent.com\n')
          PY
      - name: Validate
        run: |
          python3 -m py_compile backend/server.py
          git diff --check
          cd frontend && npm ci --no-audit --no-fund && npm run build
      - name: Commit final implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend frontend
          git diff --cached --quiet || git commit -m "Finalize FlatMate+ auth and profile features"
          git push
