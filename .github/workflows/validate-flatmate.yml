name: Validate FlatMate+

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps
      - name: Build frontend
        working-directory: frontend
        env:
          CI: false
        run: npm run build
      - name: Validate backend Python syntax
        run: python -m py_compile backend/server.py backend/feature_routes.py backend/seed_dummy_profiles.py
