name: Apply FlatMate+ product updates v4
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-product-updates-v4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Apply FlatMate+ product updates v4') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch application
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          def rep(path, old, new):
              p=root/path; s=p.read_text()
              if new in s: return
              if old not in s: raise SystemExit(f'Expected text missing: {path}')
              p.write_text(s.replace(old,new,1))

          # Shared selectable pills: inactive state must stay readable in onboarding and edit profile.
          rep('frontend/src/components/ui/badge.jsx','variant: "default",','variant: "outline",')

          # Editable rent fields in onboarding.
          rep('frontend/src/pages/Onboarding.jsx','''<Input data-testid="ob-budget-min" type="number" min={3000} max={80000} step={1000}\n                       value={d.budget_min}\n                       onChange={(e)=>set("budget_min", Math.min(80000, Math.max(3000, Math.min(Number(e.target.value)||3000, d.budget_max))))}\n                       className="rounded-xl h-11"/>''','''<Input data-testid="ob-budget-min" type="number" min={0} max={80000} step={1000} value={d.budget_min} onChange={(e)=>set("budget_min", e.target.value)} className="rounded-xl h-11"/>\n                {d.budget_min !== "" && Number(d.budget_min) < 3000 && <div className="mt-1 text-xs text-destructive">Minimum rent is ₹3,000.</div>}''')
          rep('frontend/src/pages/Onboarding.jsx','''<Input data-testid="ob-budget-max" type="number" min={3000} max={80000} step={1000}\n                       value={d.budget_max}\n                       onChange={(e)=>set("budget_max", Math.max(3000, Math.min(80000, Math.max(Number(e.target.value)||80000, d.budget_min))))}\n                       className="rounded-xl h-11"/>''','''<Input data-testid="ob-budget-max" type="number" min={0} max={80000} step={1000} value={d.budget_max} onChange={(e)=>set("budget_max", e.target.value)} className="rounded-xl h-11"/>\n                {d.budget_max !== "" && Number(d.budget_max) < 3000 && <div className="mt-1 text-xs text-destructive">Minimum rent is ₹3,000.</div>}''')
          rep('frontend/src/pages/Onboarding.jsx','''<Slider data-testid="ob-budget" min={3000} max={80000} step={1000}\n                    value={[d.budget_min, d.budget_max]}\n                    onValueChange={(v)=>{ set("budget_min", v[0]); set("budget_max", v[1]); }}/>
''','')
          rep('frontend/src/pages/Onboarding.jsx','valid: () => d.housing_status,','valid: () => d.housing_status && d.budget_min !== "" && d.budget_max !== "" && Number(d.budget_min) >= 3000 && Number(d.budget_max) >= 3000 && Number(d.budget_min) <= Number(d.budget_max) && Number(d.budget_max) <= 80000,')
          rep('frontend/src/pages/Onboarding.jsx','const { non_negotiables, ...payload } = d;\n      await api.put("/onboarding", payload);','const { non_negotiables, ...payload } = d;\n      payload.budget_min=Number(payload.budget_min); payload.budget_max=Number(payload.budget_max);\n      await api.put("/onboarding", payload);')

          # Editable rent fields in edit profile.
          rep('frontend/src/pages/EditProfile.jsx','''<div>\n            <Label className="text-xs text-muted-foreground">BUDGET ₹{f.budget_min?.toLocaleString()} – ₹{f.budget_max?.toLocaleString()}</Label>\n            <Slider data-testid="ep-budget" min={3000} max={80000} step={1000}\n                    value={[f.budget_min || 8000, f.budget_max || 25000]}\n                    onValueChange={(v)=>setF(p=>({...p, budget_min:v[0], budget_max:v[1]}))}/>\n          </div>''','''<div>\n            <Label className="text-xs text-muted-foreground mb-2 block">BUDGET (₹/month)</Label>\n            <div className="grid grid-cols-2 gap-3">\n              <div><Label className="text-xs text-muted-foreground mb-1 block">MINIMUM</Label><Input data-testid="ep-budget-min" type="number" min={0} max={80000} value={f.budget_min ?? ""} onChange={(e)=>set("budget_min",e.target.value)} className="rounded-xl h-11"/>{f.budget_min !== "" && Number(f.budget_min)<3000 && <div className="mt-1 text-xs text-destructive">Minimum rent is ₹3,000.</div>}</div>\n              <div><Label className="text-xs text-muted-foreground mb-1 block">MAXIMUM</Label><Input data-testid="ep-budget-max" type="number" min={0} max={80000} value={f.budget_max ?? ""} onChange={(e)=>set("budget_max",e.target.value)} className="rounded-xl h-11"/>{f.budget_max !== "" && Number(f.budget_max)<3000 && <div className="mt-1 text-xs text-destructive">Minimum rent is ₹3,000.</div>}</div>\n            </div>\n          </div>''')
          rep('frontend/src/pages/EditProfile.jsx','const save = async () => {\n    setSaving(true);','const save = async () => {\n    if(f.budget_min===""||f.budget_max===""||Number(f.budget_min)<3000||Number(f.budget_max)<3000||Number(f.budget_min)>Number(f.budget_max)||Number(f.budget_max)>80000){toast.error("Please enter a valid rent range: ₹3,000–₹80,000.");return;}\n    setSaving(true);')
          rep('frontend/src/pages/EditProfile.jsx','main_photo_verified, non_negotiables, photos, flat_photos, prompts, ...rest } = f;','main_photo_verified, non_negotiables, photos, flat_photos, prompts, ...rest } = f;\n      rest.budget_min=Number(rest.budget_min); rest.budget_max=Number(rest.budget_max);')

          # Settings page.
          sp=root/'frontend/src/pages/Settings.jsx'
          if not sp.exists(): sp.write_text('''import {useEffect,useState} from "react";\nimport {useNavigate} from "react-router-dom";\nimport {api} from "@/lib/api";\nimport {Switch} from "@/components/ui/switch";\nimport {ArrowLeft,Bell} from "lucide-react";\nimport {toast} from "sonner";\nexport default function Settings(){const nav=useNavigate();const [enabled,setEnabled]=useState(true);const [saving,setSaving]=useState(false);useEffect(()=>{api.get("/settings").then(({data})=>setEnabled(data.message_banner_enabled!==false)).catch(()=>{});},[]);const update=async v=>{setEnabled(v);setSaving(true);try{await api.patch("/settings",{message_banner_enabled:v})}catch{setEnabled(!v);toast.error("Could not update settings")}finally{setSaving(false)}};return <div className="app-shell min-h-[100dvh]"><div className="sticky top-0 z-10 bg-background/90 backdrop-blur-md border-b px-4 py-3 flex items-center gap-3"><button onClick={()=>nav("/profile")} className="w-9 h-9 rounded-full grid place-items-center hover:bg-secondary"><ArrowLeft className="w-4 h-4"/></button><h1 className="font-display font-extrabold text-lg">Settings</h1></div><div className="px-6 py-6"><div className="rounded-3xl bg-card border p-4 flex items-center gap-3"><div className="w-10 h-10 rounded-full bg-primary/10 text-primary grid place-items-center"><Bell className="w-5 h-5"/></div><div className="flex-1"><div className="font-semibold">New message banner</div><div className="text-sm text-muted-foreground">Show a banner at the top when a new chat message arrives.</div></div><Switch checked={enabled} disabled={saving} onCheckedChange={update}/></div></div></div>}\n''')
          rep('frontend/src/App.js','import EditProfile from "@/pages/EditProfile";\n','import EditProfile from "@/pages/EditProfile";\nimport Settings from "@/pages/Settings";\nimport {useState} from "react";\nimport {BACKEND_URL,api} from "@/lib/api";\n')
          rep('frontend/src/App.js','<Route path="/edit-profile" element={<Protected><EditProfile /></Protected>} />','<Route path="/edit-profile" element={<Protected><EditProfile /></Protected>} />\n      <Route path="/settings" element={<Protected><Settings /></Protected>} />')
          rep('frontend/src/App.js','function App() {\n  return (','''function IncomingMessageBanner(){const {user}=useAuth();const loc=useLocation();const [msg,setMsg]=useState(null);useEffect(()=>{if(!user)return;const token=localStorage.getItem("fm_token");if(!token)return;let ws,closed=false,retry;const connect=()=>{ws=new WebSocket(BACKEND_URL.replace(/^http/,"ws")+`/api/ws/${user.user_id}?token=${token}`);ws.onmessage=async e=>{try{const d=JSON.parse(e.data);if(d.type!=="message")return;const {data:s}=await api.get("/settings");if(s.message_banner_enabled===false||loc.pathname===`/chat/${d.message.match_id}`)return;setMsg(d.message);clearTimeout(retry);retry=setTimeout(()=>setMsg(null),5000)}catch{}};ws.onclose=()=>{if(!closed)retry=setTimeout(connect,2500)}};connect();return()=>{closed=true;clearTimeout(retry);ws?.close()}},[user?.user_id,loc.pathname]);if(!msg)return null;return <button onClick={()=>window.location.href=`/chat/${msg.match_id}`} className="fixed top-3 left-1/2 -translate-x-1/2 z-[70] w-[calc(100%-2rem)] max-w-md rounded-2xl bg-foreground text-background px-4 py-3 shadow-lift text-left"><div className="text-xs font-mono-label opacity-70">NEW MESSAGE</div><div className="font-semibold mt-1">{msg.text}</div></button>}\n\nfunction App() {\n  return (''')
          rep('frontend/src/App.js','<AppRouter />\n          <Toaster','<AppRouter />\n          <IncomingMessageBanner />\n          <Toaster')
          rep('frontend/src/pages/Profile.jsx','<Button data-testid="edit-profile-btn" variant="outline" onClick={()=>navigate("/edit-profile")}','<Button data-testid="settings-btn" variant="ghost" onClick={()=>navigate("/settings")} className="mt-2 w-full h-11 rounded-2xl">Settings</Button>\n        <Button data-testid="edit-profile-btn" variant="outline" onClick={()=>navigate("/edit-profile")}')

          # Unread dot in bottom nav and match list.
          rep('frontend/src/components/BottomNav.jsx','import { NavLink } from "react-router-dom";\n','import { NavLink } from "react-router-dom";\nimport {useEffect,useState} from "react";\nimport {api} from "@/lib/api";\n')
          rep('frontend/src/components/BottomNav.jsx','export default function BottomNav() {\n  const items = [','''export default function BottomNav(){const [unread,setUnread]=useState(false);useEffect(()=>{let alive=true;const load=async()=>{try{const {data}=await api.get("/matches");if(alive)setUnread(data.some(x=>(x.unread_count||0)>0))}catch{}};load();const id=setInterval(load,5000);return()=>{alive=false;clearInterval(id)}},[]);const items=[''')
          rep('frontend/src/components/BottomNav.jsx','<span className="font-semibold">{label}</span>','<span className="font-semibold relative">{label}{to==="/matches"&&unread&&<span className="absolute -top-1 -right-3 w-2.5 h-2.5 rounded-full bg-destructive border-2 border-card"/>}</span>')
          rep('frontend/src/pages/Matches.jsx','items.map(({ match, other, last_message }) => (','items.map(({ match, other, last_message, unread_count=0 }) => (')
          rep('frontend/src/pages/Matches.jsx','<div className="font-display font-bold truncate">{other?.name}</div>','<div className="flex items-center gap-2"><div className="font-display font-bold truncate">{other?.name}</div>{unread_count>0&&<span className="w-2.5 h-2.5 rounded-full bg-destructive shrink-0"/>}</div>')

          # Chat profile expansion and match report.
          rep('frontend/src/pages/Chat.jsx','import { ArrowLeft, Send, Sparkles } from "lucide-react";','import {ArrowLeft,Send,Sparkles,X,ChevronLeft,ChevronRight} from "lucide-react";')
          rep('frontend/src/pages/Chat.jsx','  const [score, setScore] = useState(0);','  const [score,setScore]=useState(0); const [report,setReport]=useState(null); const [profileOpen,setProfileOpen]=useState(false); const [photoIndex,setPhotoIndex]=useState(0);')
          rep('frontend/src/pages/Chat.jsx','setScore(m.match.score);','setScore(m.match.score); setReport(m.report||m.match.report||null);')
          rep('frontend/src/pages/Chat.jsx','<div className="sticky top-0 z-10 bg-background/90 backdrop-blur-md border-b px-4 py-3 flex items-center gap-3">','<button onClick={()=>setProfileOpen(true)} className="sticky top-0 z-10 bg-background/90 backdrop-blur-md border-b px-4 py-3 flex items-center gap-3 w-full text-left">')
          rep('frontend/src/pages/Chat.jsx','      </div>\n\n      <div ref={scrollRef}','      </button>\n\n      <div ref={scrollRef}')
          rep('frontend/src/pages/Chat.jsx','      <form onSubmit={send}','''      {profileOpen&&<div className="fixed inset-0 z-50 bg-black/60 flex items-end justify-center" onClick={()=>setProfileOpen(false)}><div className="w-full max-w-md max-h-[88dvh] overflow-y-auto rounded-t-3xl bg-background p-5" onClick={e=>e.stopPropagation()}><div className="flex items-center justify-between mb-4"><h2 className="font-display font-extrabold text-xl">{other?.name}'s profile</h2><button onClick={()=>setProfileOpen(false)} className="w-9 h-9 rounded-full grid place-items-center bg-secondary"><X className="w-4 h-4"/></button></div>{other?.photos?.length>0&&<div className="relative aspect-[4/5] rounded-3xl overflow-hidden bg-secondary"><img src={fileUrl(other.photos[photoIndex])} className="w-full h-full object-cover" alt={other.name}/>{other.photos.length>1&&<><button onClick={()=>setPhotoIndex(i=>(i-1+other.photos.length)%other.photos.length)} className="absolute left-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/40 text-white grid place-items-center"><ChevronLeft/></button><button onClick={()=>setPhotoIndex(i=>(i+1)%other.photos.length)} className="absolute right-3 top-1/2 -translate-y-1/2 w-9 h-9 rounded-full bg-black/40 text-white grid place-items-center"><ChevronRight/></button></>}</div>}{other?.bio&&<p className="mt-4 text-sm">{other.bio}</p>}{other?.prompts?.length>0&&<div className="mt-4 space-y-2">{other.prompts.map((p,i)=><div key={i} className="p-3 rounded-2xl bg-secondary"><div className="font-mono-label text-muted-foreground">{p.q}</div><div className="font-semibold mt-1">{p.a}</div></div>)}</div>}<div className="mt-5"><div className="font-mono-label text-primary mb-2">MATCH REPORT</div><div className="text-3xl font-display font-extrabold">{score}% overall</div>{report&&<div className="mt-4 space-y-3">{Object.entries(report).map(([k,v])=><div key={k}><div className="flex justify-between text-sm mb-1"><span className="font-semibold">{v.label}</span><span>{v.percent}%</span></div><div className="h-2 rounded-full bg-secondary overflow-hidden"><div className="h-full bg-primary rounded-full" style={{width:`${v.percent}%`}}/></div><div className="text-xs text-muted-foreground mt-1">{v.detail}</div></div>)}</div>}</div></div></div>}\n\n      <form onSubmit={send}''')

          # Discover: presets from selected non-negotiables; users can edit them in FiltersSheet.
          rep('frontend/src/pages/Discover.jsx','const [filters, setFilters] = useState({});','''const [filters,setFilters]=useState({});\n  const presetFilters=()=>{const nn=new Set(user?.non_negotiables||[]);const f={radius_km:user?.radius_km??5,food:[],smoking:[],drinking:[],housing:[],budget_min:3000,budget_max:80000};if(nn.has("food_pref")&&user?.food_pref)f.food=[user.food_pref];if(nn.has("smoking")&&user?.smoking)f.smoking=[user.smoking];if(nn.has("drinking")&&user?.drinking)f.drinking=[user.drinking];if(nn.has("cleanliness")&&user?.cleanliness)f.cleanliness=Number(user.cleanliness);if(nn.has("pets_ok"))f.pets_ok=String(!!user.pets_ok);if(nn.has("male_guests_ok"))f.male_guests_ok=String(!!user.male_guests_ok);if(nn.has("family_visits_ok"))f.family_visits_ok=String(!!user.family_visits_ok);if(nn.has("hosts_parties")&&user?.hosts_parties)f.hosts_parties=[user.hosts_parties];if(nn.has("sleep_schedule")&&user?.sleep_schedule)f.sleep_schedule=[user.sleep_schedule];return f;};''')
          rep('frontend/src/pages/Discover.jsx','if (f.budget_max) params.budget_max = f.budget_max;','''if (f.budget_max) params.budget_max=f.budget_max;if(f.cleanliness)params.cleanliness=f.cleanliness;if(f.pets_ok!=null)params.pets_ok=f.pets_ok;if(f.male_guests_ok!=null)params.male_guests_ok=f.male_guests_ok;if(f.family_visits_ok!=null)params.family_visits_ok=f.family_visits_ok;if(f.hosts_parties?.length)params.hosts_parties=f.hosts_parties.join(",");if(f.sleep_schedule?.length)params.sleep_schedule=f.sleep_schedule.join(",");''')
          rep('frontend/src/pages/Discover.jsx','useEffect(() => { load(); }, []);','useEffect(()=>{const initial=presetFilters();setFilters(initial);load(initial)},[user?.user_id]);')

          # FiltersSheet: add preset/editable filters.
          rep('frontend/src/components/FiltersSheet.jsx','const HOUSING_OPTS = [["have_house","Has house"],["need_house_together","Find together"],["need_house_from_someone","Wants room"]];','const HOUSING_OPTS=[["have_house","Has house"],["need_house_together","Find together"],["need_house_from_someone","Wants room"]]; const CLEAN_OPTS=[[1,"1/5"],[2,"2/5"],[3,"3/5"],[4,"4/5"],[5,"5/5"]]; const BOOL_OPTS=[["true","Yes"],["false","No"]]; const PARTY_OPTS=[["rarely","Rarely"],["sometimes","Sometimes"],["often","Often"]]; const SLEEP_OPTS=[["early_bird","Early bird"],["night_owl","Night owl"],["flexible","Flexible"]];')
          rep('frontend/src/components/FiltersSheet.jsx','    budget_max: filters.budget_max ?? 80000,\n  });','    budget_max: filters.budget_max ?? 80000, cleanliness: filters.cleanliness ?? null, pets_ok: filters.pets_ok ?? null, male_guests_ok: filters.male_guests_ok ?? null, family_visits_ok: filters.family_visits_ok ?? null, hosts_parties: filters.hosts_parties || [], sleep_schedule: filters.sleep_schedule || [],\n  });')
          rep('frontend/src/components/FiltersSheet.jsx','const reset = () => setF({ radius_km: userRadius ?? 5, food: [], smoking: [], drinking: [], housing: [], budget_min: 3000, budget_max: 80000 });','const reset = () => setF({radius_km:userRadius??5,food:[],smoking:[],drinking:[],housing:[],budget_min:3000,budget_max:80000,cleanliness:null,pets_ok:null,male_guests_ok:null,family_visits_ok:null,hosts_parties:[],sleep_schedule:[]});')
          rep('frontend/src/components/FiltersSheet.jsx','''            ["housing", "HOUSING", HOUSING_OPTS],\n          ].map(([k, l, opts]) => (''','''            ["housing", "HOUSING", HOUSING_OPTS], ["hosts_parties","PARTIES",PARTY_OPTS], ["sleep_schedule","SLEEP",SLEEP_OPTS],\n          ].map(([k, l, opts]) => (''')
          rep('frontend/src/components/FiltersSheet.jsx','        </div>\n\n        <div className="mt-8 flex gap-2','''          <div><Label className="font-mono-label mb-2 block">CLEANLINESS</Label><div className="flex flex-wrap gap-2">{CLEAN_OPTS.map(([v,l])=><Badge key={v} onClick={()=>setF(p=>({...p,cleanliness:p.cleanliness===v?null:v}))} className={`cursor-pointer rounded-full px-3 py-1.5 text-sm ${f.cleanliness===v?"bg-primary text-primary-foreground":"bg-card text-foreground border border-border"}`}>{l}</Badge>)}</div></div>\n          {[ ["pets_ok","PETS",BOOL_OPTS],["male_guests_ok","MALE GUESTS",BOOL_OPTS],["family_visits_ok","FAMILY VISITS",BOOL_OPTS] ].map(([k,l,opts])=><div key={k}><Label className="font-mono-label mb-2 block">{l}</Label><div className="flex flex-wrap gap-2">{opts.map(([v,lb])=><Badge key={v} onClick={()=>setF(p=>({...p,[k]:p[k]===v?null:v}))} className={`cursor-pointer rounded-full px-3 py-1.5 text-sm ${f[k]===v?"bg-primary text-primary-foreground":"bg-card text-foreground border border-border"}`}>{lb}</Badge>)}</div></div>)}\n        </div>\n\n        <div className="mt-8 flex gap-2''')

          # Backend: reports, unread state, editable non-negotiable filters, settings.
          bp=root/'backend/server.py'; s=bp.read_text()
          if '# FMPLUS_PRODUCT_UPDATES_V4' not in s:
              s=s.replace('class MessageIn(BaseModel):\n    match_id: str\n    text: str','class MessageIn(BaseModel):\n    match_id: str\n    text: str\n\nclass SettingsIn(BaseModel):\n    message_banner_enabled: bool')
              s=s.replace('"main_photo_verified": False,\n        "created_at":','"main_photo_verified": False,\n        "message_banner_enabled": True,\n        "created_at":',1)
              report='''def compute_match_report(a: dict, b: dict) -> Dict[str, Any]:\n    amin,amax=int(a.get("budget_min") or 0),int(a.get("budget_max") or 0); bmin,bmax=int(b.get("budget_min") or 0),int(b.get("budget_max") or 0)\n    budget=100 if amax>=bmin and bmax>=amin else max(0,60-round(max(bmin-amax,amin-bmax,0)/1000)*5)\n    ca,cb=int(a.get("cleanliness") or 3),int(b.get("cleanliness") or 3)\n    def same(k,bad=30): return 100 if a.get(k)==b.get(k) else bad\n    return {"cleanliness":{"label":"Cleanliness","percent":max(0,100-abs(ca-cb)*25),"detail":f"You: {ca}/5 · Them: {cb}/5"},"budget":{"label":"Rent budget alignment","percent":budget,"detail":f"You: ₹{amin:,}–₹{amax:,} · Them: ₹{bmin:,}–₹{bmax:,}"},"food":{"label":"Food preferences","percent":same("food_pref",35),"detail":f"You: {a.get('food_pref') or '—'} · Them: {b.get('food_pref') or '—'}"},"sleep":{"label":"Sleep schedule","percent":same("sleep_schedule",40),"detail":f"You: {a.get('sleep_schedule') or '—'} · Them: {b.get('sleep_schedule') or '—'}"},"social":{"label":"Social style","percent":same("social_level",40),"detail":f"You: {a.get('social_level') or '—'} · Them: {b.get('social_level') or '—'}"},"smoking":{"label":"Smoking","percent":same("smoking",30),"detail":f"You: {a.get('smoking') or '—'} · Them: {b.get('smoking') or '—'}"},"drinking":{"label":"Drinking","percent":same("drinking",30),"detail":f"You: {a.get('drinking') or '—'} · Them: {b.get('drinking') or '—'}"}}\n\n# FMPLUS_PRODUCT_UPDATES_V4\n\n'''
              s=s.replace('def gender_ok(x, y):',report+'def gender_ok(x, y):',1)
              s=s.replace('''    if "cleanliness" in non_neg:\n        try:\n            if abs(int(a.get("cleanliness") or 3) - int(b.get("cleanliness") or 3)) > 1:\n                return False\n        except Exception: pass''','''    if "cleanliness" in non_neg:\n        try:\n            if abs(int(a.get("cleanliness") or 3) - int(b.get("cleanliness") or 3)) > 1: return False\n        except Exception: pass\n    if "hosts_parties" in non_neg and a.get("hosts_parties") != b.get("hosts_parties"): return False\n    if "sleep_schedule" in non_neg and a.get("sleep_schedule") != b.get("sleep_schedule"): return False''')
              s=s.replace('''    if filters.get("budget_min") is not None and (b.get("budget_max") or 999999) < filters["budget_min"]:\n        return False\n    return True''','''    if filters.get("budget_min") is not None and (b.get("budget_max") or 999999) < filters["budget_min"]: return False\n    if filters.get("cleanliness") is not None and abs(int(b.get("cleanliness") or 3)-int(filters["cleanliness"]))>1: return False\n    for key in ("pets_ok","male_guests_ok","family_visits_ok"):\n        if filters.get(key) is not None and bool(b.get(key))!=bool(filters[key]): return False\n    if filters.get("hosts_parties") and b.get("hosts_parties") not in filters["hosts_parties"]: return False\n    if filters.get("sleep_schedule") and b.get("sleep_schedule") not in filters["sleep_schedule"]: return False\n    return True''')
